repository_type: pipeline

nf_core_version: 4.1.0

lint:
  # skip_features: igenomes (proteomes come from iProteomes or --database), so the iGenomes configs are absent
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
  files_unchanged:
    # GitHub Actions hardening: event values reach the shell as env vars, the nf-core version and the comment header are validated
    - .github/workflows/branch.yml
    - .github/workflows/linting.yml
    - .github/workflows/pr-comment.yml
    # The publicly runnable test profile is test_dia (the other profiles need the licensed FragPipe image)
    - .github/PULL_REQUEST_TEMPLATE.md
    # Pipeline logo (the apple glyph) and the documentation index
    - assets/nf-core-msproteomics_logo_light.png
    - docs/images/nf-core-msproteomics_logo_light.png
    - docs/images/nf-core-msproteomics_logo_dark.png
    - docs/README.md

# DIA-NN stays at 1.8.1: `nf-core modules update` leaves diann at this sha
# (nf_core/components/update.py, config_entry handling: a str entry is the sha to update to).
# module_version lint ignores this pin (nf_core/modules/lint/module_version.py:45-50), so it keeps its warning.
update:
  https://github.com/nf-core/modules.git:
    nf-core:
      diann: c246b66faacda1eeff12cc46b0944b8fc466179c
      # Newer utils_nfschema_plugin needs nf-schema 3.0.0 (Nextflow >=26.04); the pipeline pins nf-schema 2.5.1
      utils_nfschema_plugin: fdc08b8b1ae74f56686ce21f7ea11ad11990ce57

template:
  org: nf-core
  name: msproteomics
  description: Mass spectrometry proteomics preprocessing (DIA, DDA LFQ, TMT)
  author: Dongze He
  version: 1.0.0dev
  force: false
  skip_features:
    - igenomes
  outdir: .
  is_nfcore: true
