channels:
  - conda-forge
  - bioconda
dependencies:
  # qpx is on PyPI; bioconda lags a release, so pin the PyPI release to match the
  # GHCR container version. Switch to `bioconda::qpx=<version>` once bioconda
  # publishes it.
  - pip
  - pip:
      - qpx==1.1.5
      # qpx asks only duckdb>=1.3.0; duckdb 2.0.0 breaks qpxc convert (lambda arrow). Version in quay.io/biocontainers/qpx:1.1.5--pyhdfd78af_0.
      - duckdb==1.5.6
