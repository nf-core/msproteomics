name: "crystalc"
description: Remove chimeric artifact PSMs from pepXML search results
keywords:
  - proteomics
  - mass spectrometry
  - chimeric spectra
  - artifact removal
  - post-processing
tools:
  - crystalc:
      description: |
        Crystal-C is a post-processing tool for tandem mass spectrometry database
        search results that identifies and removes chimeric spectrum artifacts.
        It improves the accuracy of peptide identifications by filtering out
        PSMs that originate from co-fragmented precursor ions.
      homepage: "https://github.com/AimeeD90/Crystal-C"
      documentation: "https://github.com/AimeeD90/Crystal-C"
      tool_dev_url: "https://github.com/AimeeD90/Crystal-C"
      licence: ["Apache-2.0"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - pepxml_file:
        type: file
        description: Search results in pepXML format from MSFragger
        pattern: "*.pepXML"
    - lcms_file:
        type: file
        description: LC-MS file the pepXML was searched from (Crystal-C reads .mzML, .mzXML and Thermo .raw)
        pattern: "*.{mzML,mzXML,raw}"
    - config_file:
        type: file
        description: Crystal-C algorithm settings (the jar's crystalc.params defaults, as CrystalcPanel.toParams); the module adds the runtime keys
        pattern: "*.params"
  - fasta:
      type: file
      description: Protein sequence database FASTA (shared resource, required by CrystalC)
      pattern: "*.{fasta,fas,fa}"

output:
  results_dir:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}":
          type: directory
          description: Directory containing Crystal-C results and log
          pattern: "${prefix}"
  pepxml_filtered:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}/*_c.pepXML":
          type: file
          description: Filtered pepXML files with chimeric artifacts removed
          pattern: "*_c.pepXML"
  versions_crystalc:
    - - ${task.process}:
          type: string
          description: The name of the process
      - crystalc:
          type: string
          description: The name of the tool
      - "cat .crystalc_version":
          type: eval
          description: The Crystal-C version recorded from the FragPipe tools directory
  versions_fragpipe:
    - - ${task.process}:
          type: string
          description: The name of the process
      - fragpipe:
          type: string
          description: The name of the tool
      - "cat .fragpipe_version":
          type: eval
          description: The FragPipe version of the tools directory

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - crystalc:
          type: string
          description: The name of the tool
      - "cat .crystalc_version":
          type: eval
          description: The Crystal-C version recorded from the FragPipe tools directory
    - - ${task.process}:
          type: string
          description: The name of the process
      - fragpipe:
          type: string
          description: The name of the tool
      - "cat .fragpipe_version":
          type: eval
          description: The FragPipe version of the tools directory

authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
