name: "fpop"
description: Fast Photochemical Oxidation of Proteins analysis
keywords:
  - proteomics
  - mass spectrometry
  - FPOP
  - oxidation
  - structural proteomics
  - protein footprinting
tools:
  - fpop:
      description: |
        FPOP (Fast Photochemical Oxidation of Proteins) analysis module performs
        quantitative analysis of protein oxidation data from FPOP experiments.
        It calculates oxidation levels per residue/region, compares FPOP vs control
        samples, and supports both label-free and TMT-based workflows. The analysis
        is performed using a Python script bundled with FragPipe.
      homepage: "https://fragpipe.nesvilab.org/"
      documentation: "https://fragpipe.nesvilab.org/docs/tutorial_fpop.html"
      tool_dev_url: "https://github.com/Nesvilab/FragPipe"
      licence: ["Academic"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - modpep_tsv:
        type: file
        description: IonQuant combined_modified_peptide.tsv (label-free mode); [] in TMT mode
        pattern: "combined_modified_peptide.tsv"
    - tmt_report:
        type: directory
        description: TMT-Integrator report directory, staged as tmt-report (TMT mode); [] otherwise
    - tmt_report_unmod:
        type: directory
        description: Second TMT-Integrator run for unmodified peptides, staged as tmt-report-unmod (TMT mode); [] otherwise
    - config_cli:
        type: list
        description: |
          FragPipe_FPOP_Analysis.py arguments from FragPipe's plan (bin/plan_to_tool_configs.py) (CmdFpopQuant.java:90-99):
          input table, region size, control label, FPOP label, subtract control, TMT flag[, unmodified peptide table]

output:
  results_dir:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}":
          type: directory
          description: Directory containing the FPOP tables and fpop.log
          pattern: "${prefix}"
  peptides:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}/FPOP_peptides.tsv":
          type: file
          description: Peptide-level FPOP oxidation table
          pattern: "FPOP_peptides.tsv"
  sites:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}/FPOP_sites.tsv":
          type: file
          description: Site-level FPOP oxidation table
          pattern: "FPOP_sites.tsv"
  versions_fpop:
    - - ${task.process}:
          type: string
          description: The name of the process
      - fpop:
          type: string
          description: The name of the tool
      - "cat .fpop_version":
          type: eval
          description: The FragPipe version that ships the FPOP script
  versions_fragpipe:
    - - ${task.process}:
          type: string
          description: The name of the process
      - fragpipe:
          type: string
          description: The name of the tool
      - "cat .fragpipe_version":
          type: eval
          description: The FragPipe version of the tools directory

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - fpop:
          type: string
          description: The name of the tool
      - "cat .fpop_version":
          type: eval
          description: The FragPipe version that ships the FPOP script
    - - ${task.process}:
          type: string
          description: The name of the process
      - fragpipe:
          type: string
          description: The name of the tool
      - "cat .fragpipe_version":
          type: eval
          description: The FragPipe version of the tools directory

authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
