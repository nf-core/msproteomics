name: "freequant"
description: Label-free quantification using Philosopher labelfree command
keywords:
  - proteomics
  - mass spectrometry
  - quantification
  - label-free
  - ion intensity
tools:
  - philosopher:
      description: |
        FreeQuant performs label-free quantification using the Philosopher labelfree
        command. It extracts ion intensity information from mass spectrometry data
        files to quantify peptide and protein abundances. FreeQuant generates ion.tsv
        files containing ion-level quantification data for downstream analysis.
      homepage: "https://philosopher.nesvilab.org/"
      documentation: "https://github.com/Nesvilab/philosopher/wiki"
      tool_dev_url: "https://github.com/Nesvilab/philosopher"
      licence: ["GPL-3.0"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - results_dir:
        type: directory
        description: Directory containing psm.tsv from PHILOSOPHERFILTER
    - lcms_files:
        type: file
        description: LC-MS files (mzML or RAW) of one FragPipe group, staged into lcms_files/
        pattern: "*.{mzML,mzml,raw,RAW}"
    - config_cli:
        type: string
        description: FreeQuant parameters as CLI string (e.g., --ptw 0.4 --tol 10)

output:
  results_dir:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}":
          type: directory
          description: Group work directory with the FreeQuant results (ion.tsv, the .meta workspace) and freequant.log
          pattern: "${prefix}"
  versions_philosopher:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "philosopher":
          type: string
          description: The name of the tool
      - "fragpipeToolVersions().philosopher":
          type: string
          description: The version of the tool
  versions_fragpipe:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "fragpipe":
          type: string
          description: The name of the tool
      - "cat .fragpipe_version":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "philosopher":
          type: string
          description: The name of the tool
      - "fragpipeToolVersions().philosopher":
          type: string
          description: The version of the tool
    - - "${task.process}":
          type: string
          description: The name of the process
      - "fragpipe":
          type: string
          description: The name of the tool
      - "cat .fragpipe_version":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
