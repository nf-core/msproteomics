name: "mbg"
description: Mass-based glycoproteomics matching for glycan identification
keywords:
  - proteomics
  - mass spectrometry
  - glycoproteomics
  - glycan
  - mass-based matching
tools:
  - mbg:
      description: |
        MBG (Mass-Based Glycoproteomics) performs glycan identification and matching
        by analyzing PSM data against glycan databases. It matches observed mass
        shifts to known glycan compositions, supporting both standard and TMT-based
        glycoproteomics workflows. MBG is part of the FragPipe glycoproteomics
        analysis suite.
      homepage: "https://fragpipe.nesvilab.org/"
      documentation: "https://fragpipe.nesvilab.org/docs/tutorial_glyco.html"
      tool_dev_url: "https://github.com/Nesvilab/FragPipe"
      licence: ["Academic"]

input:
  - - "meta":
        type: map
        description: "Groovy Map containing sample information"
    - "psm_dir":
        type: directory
        description: "Group directory with the PTM-Shepherd glyco psm.tsv (copied: MBG replaces psm.tsv)"
    - "spectra":
        type: file
        description: "Every LC-MS file of the run (MBG reads them through the manifest)"
    - "manifest_rows":
        type: list
        description: "[file name, experiment, bioreplicate, data type] per LC-MS file, in fragpipe-files.fp-manifest order (TabWorkflow.manifestSave)"
    - "argv":
        type: list
        description: "MBG argv from FragPipe's plan (bin/plan_to_tool_configs.py) (@TOKENS@ filled by the module, @NOPASEF@ by the workflow)"
output:
  psm_dir:
    - - "meta":
          type: map
          description: "Groovy Map containing sample information"
      - "${meta.id}":
          type: directory
          description: "Group directory with the updated psm.tsv written by MBG"
          pattern: "${meta.id}"
  manifest:
    - - "meta":
          type: map
          description: "Groovy Map containing sample information"
      - "fragpipe-files.fp-manifest":
          type: file
          description: "fragpipe-files.fp-manifest given to MBG"
          pattern: "fragpipe-files.fp-manifest"
  log:
    - - "meta":
          type: map
          description: "Groovy Map containing sample information"
      - "mbg.log":
          type: file
          description: "MBG command line and output"
          pattern: "mbg.log"
  versions_mbg:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "mbg":
          type: string
          description: The name of the tool
      - "cat .mbg_version":
          type: eval
          description: The expression to obtain the version of the tool
  versions_fragpipe:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "fragpipe":
          type: string
          description: The name of the tool
      - "cat .fragpipe_version":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "mbg":
          type: string
          description: The name of the tool
      - "cat .mbg_version":
          type: eval
          description: The expression to obtain the version of the tool
    - - "${task.process}":
          type: string
          description: The name of the process
      - "fragpipe":
          type: string
          description: The name of the tool
      - "cat .fragpipe_version":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
