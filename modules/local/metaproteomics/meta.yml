name: "metaproteomics"
description: Metaproteomics database optimization and taxonomy analysis
keywords:
  - proteomics
  - mass spectrometry
  - metaproteomics
  - taxonomy
  - database optimization
  - microbiome
tools:
  - metaproteomics:
      description: |
        The Metaproteomics module performs database optimization for metaproteomics
        workflows using the DbOptimizer tool. It analyzes FragPipe search results
        to identify taxonomic composition and generates an optimized FASTA database
        by filtering proteins based on taxonomic assignments. This enables iterative
        refinement of the search database for improved metaproteomics analysis.
      homepage: "https://fragpipe.nesvilab.org/"
      documentation: "https://fragpipe.nesvilab.org/docs/tutorial_metaproteomics.html"
      tool_dev_url: "https://github.com/Nesvilab/FragPipe"
      licence: ["Academic"]

input:
  - - "meta":
        type: map
        description: "Groovy Map containing sample information"
    - "project_files":
        type: file
        description: "Every MSFragger <run>.pin and Percolator <run>_percolator_{target,decoy}_psms.tsv, staged flat like FragPipe's work dir (FP-Meta walks it 2 levels deep)"
        pattern: "*.{pin,tsv}"
    - "config_cli":
        type: map
        description: "DbOptimizer values (qvalue, deltaHyperscore, minPeptCntPerProt, minUniqPeptCntPerProt, minUniqPeptCnt, hostName, iterations, cmdLineOpts) from parse_fragpipe_workflow.py"
  - "fasta":
      type: file
      description: "Database FASTA file (shared resource)"
      pattern: "*.{fasta,fas,fa}"
  - "taxon_name_file":
      type: file
      description: "NCBI names.dmp; [] = FragPipe's tools/metaproteomics/names.dmp"
      pattern: "*.dmp"
  - "taxon_node_file":
      type: file
      description: "NCBI nodes.dmp; [] = FragPipe's tools/metaproteomics/nodes.dmp"
      pattern: "*.dmp"
  - "decoy_tag":
      type: string
      description: "Decoy protein prefix from workflow database.decoy-tag (FragpipeRun.java:1442)"
output:
  results_dir:
    - - "meta":
          type: map
          description: "Groovy Map containing sample information"
      - "${prefix}":
          type: directory
          description: "FP-Meta DbOptimizer outputs (refined database, species tables) and metaproteomics.log"
          pattern: "${prefix}"
  versions_metaproteomics:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "metaproteomics":
          type: string
          description: The name of the tool
      - "cat .metaproteomics_version":
          type: eval
          description: The expression to obtain the version of the tool
  versions_fragpipe:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "fragpipe":
          type: string
          description: The name of the tool
      - "cat .fragpipe_version":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "metaproteomics":
          type: string
          description: The name of the tool
      - "cat .metaproteomics_version":
          type: eval
          description: The expression to obtain the version of the tool
    - - "${task.process}":
          type: string
          description: The name of the process
      - "fragpipe":
          type: string
          description: The name of the tool
      - "cat .fragpipe_version":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
