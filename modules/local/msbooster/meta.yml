name: "msbooster"
description: Deep learning-based rescoring using predicted retention time and spectra
keywords:
  - proteomics
  - mass spectrometry
  - deep learning
  - rescoring
  - retention time
  - spectral prediction
tools:
  - msbooster:
      description: |
        MSBooster enhances peptide identification by using deep learning predictions
        of retention time and MS2 spectra. It rescores PSMs using features derived
        from comparing observed vs predicted properties, improving sensitivity.
      homepage: "https://github.com/Nesvilab/MSBooster"
      documentation: "https://github.com/Nesvilab/MSBooster/wiki"
      tool_dev_url: "https://github.com/Nesvilab/MSBooster"
      licence: ["Apache-2.0"]
      note: "Runs from the FragPipe image (--fragpipe_container)"

input:
  - - "meta":
        type: map
        description: "Groovy Map containing sample information"
    - "pin_files":
        type: file
        description: "MSFragger PIN file(s)"
        pattern: "*.pin"
    - "mzml_files":
        type: file
        description: "FragPipe's LC-MS directory content for those PINs (LC-MS files plus the MSFragger mzML outputs); MSBooster matches <base>.mzML / <base>_uncalibrated.mzML / .mgf itself"
        pattern: "*"
  - "params_text":
      type: string
      description: "Workflow-derived msbooster params (FragPipe's plan, msbooster.config text)"
  - "fragger_params":
      type: file
      description: "MSFragger params file MSBooster reads (CmdMSBooster.java:134-149)"
      pattern: "*.params"
  - "library":
      type: file
      description: "The file of msbooster.spectral-library-path (spectraPredFile/RTPredFile/IMPredFile; CmdMSBooster.java:180-184), staged as spectral_library/<name>; empty list without one"
      pattern: "*"
  - "has_ion_mobility":
      type: boolean
      description: "True when any LC-MS file of the run is timsTOF data"
  - "threads":
      type: integer
      description: "numThreads of params_text (workflow.threads / --fragpipe_threads); the task asks for that many cores"
  - "pin_dirs":
      type: list
      description: "FragPipe group of each PIN (same order as pin_files; '' for the blank group); MSBooster is given <group>/<pin>"
output:
  results_dir:
    - - "meta":
          type: map
          description: "Groovy Map containing sample information"
      - "${prefix}":
          type: directory
          description: "Directory with the rescored PINs, msbooster_params.txt and the MSBooster log"
          pattern: "${prefix}"
  pin_edited:
    - - "meta":
          type: map
          description: "Groovy Map containing sample information"
      - "${prefix}/*.pin":
          type: file
          description: "<base>_edited.pin, the rescored PIN MSBooster writes"
          pattern: "*_edited.pin"
  predictions:
    - - "meta":
          type: map
          description: "Groovy Map containing sample information"
      - "${booster_dir}":
          type: directory
          description: "MSBooster/ under the PINs' deepest common directory: spectraRT.tsv, spectraRT_full.tsv, spectraRT.predicted.bin (FragPipe-PDV) and MSBooster_plots/"
          pattern: "MSBooster"
  versions_msbooster:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "msbooster":
          type: string
          description: The name of the tool
      - "cat .msbooster_version":
          type: eval
          description: The expression to obtain the version of the tool
  versions_fragpipe:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "fragpipe":
          type: string
          description: The name of the tool
      - "cat .fragpipe_version":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "msbooster":
          type: string
          description: The name of the tool
      - "cat .msbooster_version":
          type: eval
          description: The expression to obtain the version of the tool
    - - "${task.process}":
          type: string
          description: The name of the process
      - "fragpipe":
          type: string
          description: The name of the tool
      - "cat .fragpipe_version":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
