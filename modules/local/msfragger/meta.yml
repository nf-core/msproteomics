name: "msfragger"
description: Ultrafast peptide identification using MSFragger search engine
keywords:
  - proteomics
  - mass spectrometry
  - peptide identification
  - database search
  - msfragger
tools:
  - msfragger:
      description: |
        MSFragger is an ultrafast database search tool for peptide identification
        in mass spectrometry-based proteomics. It uses a fragment-ion indexing method
        to achieve speeds 10-100x faster than conventional search engines.
      homepage: "https://msfragger.nesvilab.org/"
      documentation: "https://github.com/Nesvilab/MSFragger/wiki"
      tool_dev_url: "https://github.com/Nesvilab/MSFragger"
      doi: "10.1038/nmeth.4256"
      licence: ["Proprietary (free for academic research)"]
      note: "License pre-installed in container"

input:
  - - "meta":
        type: map
        description: "Groovy Map containing sample information"
    - "mzml_files":
        type: file
        description: "Mass spectrometry data file(s) (mzML, raw or Bruker .d)"
        pattern: "*.{mzML,raw,d}"
    - "params_name":
        type: string
        description: "FragPipe's name of the file's MSFragger params set (fragger.params, fragger_dda.params, fragger_dia.params, fragger_gpfdia.params, fragger_dda_plus.params; CmdMsfragger.java:444-447, 541-552)"
    - "params_text":
        type: string
        description: "Text of that params set"
    - "fasta":
        type: file
        description: "Protein sequence database"
        pattern: "*.{fasta,fas,fa}"
output:
  pepxml:
    - - "meta":
          type: map
          description: "Groovy Map containing sample information"
      - "${prefix}/*.pepXML":
          type: file
          description: "Peptide identifications in pepXML format"
          pattern: "*.pepXML"
  pin:
    - - "meta":
          type: map
          description: "Groovy Map containing sample information"
      - "${prefix}/*.pin":
          type: file
          description: "Percolator input file"
          pattern: "*.pin"
  tsv:
    - - "meta":
          type: map
          description: "Groovy Map containing sample information"
      - "${prefix}/*.tsv":
          type: file
          description: "TSV output from MSFragger (e.g. mass calibration results)"
          pattern: "*.tsv"
  lcms_files:
    - - "meta":
          type: map
          description: "Groovy Map containing sample information"
      - "{*_uncalibrated.mzML,*_calibrated.mzML,*_uncalibrated.mzBIN,*.mzBIN_calibrated}":
          type: file
          description: "Files MSFragger writes next to the LC-MS file (<base>_uncalibrated.mzML, <base>_calibrated.mzML, <base>_uncalibrated.mzBIN, <base>.mzBIN_calibrated); FragPipe's downstream tools read them from the LC-MS directory"
          pattern: "{*_uncalibrated.mzML,*_calibrated.mzML,*_uncalibrated.mzBIN,*.mzBIN_calibrated}"
  mzbin_all:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.mzBIN_all":
          type: file
          description: |
            <base>.mzBIN_all MSFragger writes next to the LC-MS file with write_mzbin_all = 1
            (Write sub mzML, FragpipeRun.java:1481); read by WRITESUBMZML (WriteSubMzml.java:73).
          pattern: "*.mzBIN_all"
  pepindex:
    - - "meta":
          type: map
          description: "Groovy Map containing sample information"
      - "*.pepindex":
          type: file
          description: "Peptide index MSFragger builds next to the FASTA, one <fasta>.<N>.pepindex per distinct digestion parameter set of the call (first search and main search with calibrate_mass 1/2)"
          pattern: "*.pepindex"
  results_dir:
    - - "meta":
          type: map
          description: "Groovy Map containing sample information"
      - "${prefix}":
          type: directory
          description: "Directory with the search outputs, the params file and the MSFragger log"
          pattern: "${prefix}"
  log:
    - - "meta":
          type: map
          description: "Groovy Map containing sample information"
      - "${prefix}/*.log":
          type: file
          description: "MSFragger log file"
          pattern: "*.log"
  license_agreement:
    - "I_AGREE_FRAGPIPE_LICENSE_AGREEMENT":
        type: file
        description: "Marker file recording the FragPipe license agreement"
        pattern: "I_AGREE_FRAGPIPE_LICENSE_AGREEMENT"
  versions_msfragger:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "msfragger":
          type: string
          description: The name of the tool
      - "cat .msfragger_version":
          type: eval
          description: The expression to obtain the version of the tool
  versions_fragpipe:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "fragpipe":
          type: string
          description: The name of the tool
      - "cat .fragpipe_version":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "msfragger":
          type: string
          description: The name of the tool
      - "cat .msfragger_version":
          type: eval
          description: The expression to obtain the version of the tool
    - - "${task.process}":
          type: string
          description: The name of the process
      - "fragpipe":
          type: string
          description: The name of the tool
      - "cat .fragpipe_version":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
