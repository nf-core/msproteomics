name: "mzmlindexing"
description: Converts mzML to indexed mzML
keywords:
  - raw
  - mzML
  - OpenMS
tools:
  - FileConverter:
      description: |
        Converts between different MS file formats
      homepage: http://www.openms.de/doxygen/nightly/html/TOPP_FileConverter.html
      documentation: http://www.openms.de/doxygen/nightly/html/TOPP_FileConverter.html
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
    - mzmlfile:
        type: file
        description: |
          Input file to convert.
        pattern: "*.mzML"
        ontologies: []
output:
  mzmls_indexed:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - out/*.mzML:
          type: file
          description: indexed mzML file
          pattern: "*.mzML"
          ontologies: []
  log:
    - "*.log":
        type: file
        description: log file
        pattern: "*.log"
        ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies: []

topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies: []

authors:
  - "@daichengxin"
