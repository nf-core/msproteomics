name: "opair"
description: O-glycoproteomics analysis for O-glycan identification and localization
keywords:
  - proteomics
  - mass spectrometry
  - glycoproteomics
  - O-glycan
  - glycosylation
  - localization
tools:
  - opair:
      description: |
        O-Pair performs O-glycoproteomics analysis by identifying and localizing
        O-linked glycan modifications on peptides. It uses paired fragmentation
        spectra to determine glycan compositions and attachment sites, generating
        glycoform-level results. O-Pair is part of the FragPipe glycoproteomics
        analysis suite and runs as a .NET application.
      homepage: "https://fragpipe.nesvilab.org/"
      documentation: "https://fragpipe.nesvilab.org/docs/tutorial_glyco.html"
      tool_dev_url: "https://github.com/Nesvilab/FragPipe"
      licence: ["Academic"]

input:
  - - meta:
        type: map
        description: Group metadata map (meta.id = group directory name)
    - psm_dir:
        type: directory
        description: FragPipe group directory with psm.tsv (copied; O-Pair writes into psm.tsv)
    - spectra:
        type: file
        description: The group's LC-MS files as CmdOPair lists them (_calibrated.mzML, _uncalibrated.mzML or the input file)
        pattern: "*.{mzML,mzXML}"
    - pairs:
        type: file
        description: PairScans scan-pair files ([] for single scan type)
        pattern: "*.pairs"
    - oxonium_file:
        type: file
        description: |
          The user's oxonium ion definitions file (workflow opair.oxonium_filtering_file, O-Pair -f,
          CmdOPair.java:178-180), staged as oxonium/<name>; [] to use FragPipe's default in the tools dir
    - filelist:
        type: list
        description: Spectra file names in FragPipe's order for filelist_opair.txt
    - argv:
        type: list
        description: O-Pair argv from FragPipe's plan (bin/plan_to_tool_configs.py) (one token per flag; run-time tokens, @OXONIUM_FILE@ included, filled in the module)

output:
  psm_dir:
    - - meta:
          type: map
          description: Group metadata map (meta.id = group directory name)
      - "${meta.id}":
          type: directory
          description: Group directory with O-Pair's psm.tsv and filelist_opair.txt
  log:
    - - meta:
          type: map
          description: Group metadata map (meta.id = group directory name)
      - "opair.log":
          type: file
          description: O-Pair command and output
  versions_opair:
    - - ${task.process}:
          type: string
          description: Process name
      - opair:
          type: string
          description: Tool name
      - fragpipeToolVersions().opair:
          type: string
          description: 'Version; fixed value (fragpipeToolVersions()): tools/opair/CMD.dll has no version in its path; FragPipe 24.0''s CMD.dll prints "PTMLocalization version: 1.1.10"'
  versions_fragpipe:
    - - ${task.process}:
          type: string
          description: Process name
      - fragpipe:
          type: string
          description: Tool name
      - cat .fragpipe_version:
          type: eval
          description: Version

topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - opair:
          type: string
          description: Tool name
      - fragpipeToolVersions().opair:
          type: string
          description: 'Version of O-Pair; fixed value (fragpipeToolVersions()): tools/opair/CMD.dll has no version in its path; FragPipe 24.0''s CMD.dll prints "PTMLocalization version: 1.1.10"'
    - - ${task.process}:
          type: string
          description: Process name
      - fragpipe:
          type: string
          description: Tool name
      - cat .fragpipe_version:
          type: eval
          description: Version of FragPipe

authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
