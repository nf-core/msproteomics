name: "parsefragpipeworkflow"
description: Parse FragPipe workflow files into per-tool configuration files and JSON
keywords:
  - proteomics
  - fragpipe
  - workflow
  - configuration
  - parsing
tools:
  - parse_fragpipe_workflow:
      description: |
        Custom Python script that parses FragPipe .workflow files and extracts
        per-tool configuration into individual config files and a unified JSON
        output. Generates fragger.params, ionquant.config, msbooster.config,
        percolator.config, and other tool-specific configuration files.
      homepage: "https://github.com/nf-fragpipe/nf-fragpipe"
      documentation: "https://github.com/nf-fragpipe/nf-fragpipe"
      tool_dev_url: "https://github.com/nf-fragpipe/nf-fragpipe"
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - workflow_file:
        type: file
        description: FragPipe workflow file containing tool parameters
        pattern: "*.workflow"
    - data_types:
        type: list
        description: FragPipe data types of the manifest files (DDA, DDA+, DIA, DIA-Quant, DIA-Lib, GPF-DIA); FragPipe adjusts tools to them after loading the manifest (TabWorkflow.adjustToolsBasedOnDataTypes)

output:
  tool_configs_json:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "tool_configs.json":
          type: file
          description: |
            JSON file with all tool configs including run flags and arguments
            (diaumpire.q_tiers: the DIA-Umpire Q tiers FragPipe searches)
          pattern: "tool_configs.json"
  msfragger_config:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "configs/{fragger,fragger_dda}.params":
          type: file
          description: MSFragger parameters for DDA files (CmdMsfragger.java:444-457); fragger_dda.params when the manifest also has DIA, GPF-DIA or DIA-Lib files (optional)
          pattern: "configs/{fragger,fragger_dda}.params"
  msfragger_dia_config:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "configs/fragger_dia.params":
          type: file
          description: MSFragger parameters for DIA and DIA-Lib files (CmdMsfragger.java:444-457, adjustMSFraggerParams)
          pattern: "configs/fragger_dia.params"
  msfragger_gpfdia_config:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "configs/fragger_gpfdia.params":
          type: file
          description: MSFragger parameters for GPF-DIA files (CmdMsfragger.java:444-457, adjustMSFraggerParams)
          pattern: "configs/fragger_gpfdia.params"
  msfragger_dda_plus_config:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "configs/fragger_dda_plus.params":
          type: file
          description: MSFragger parameters for DDA+ files (CmdMsfragger.java:444-457, adjustMSFraggerParams)
          pattern: "configs/fragger_dda_plus.params"
  ionquant_config:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "configs/ionquant.config":
          type: file
          description: IonQuant CLI configuration
          pattern: "configs/ionquant.config"
  msbooster_config:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "configs/msbooster.config":
          type: file
          description: MSBooster parameters file
          pattern: "configs/msbooster.config"
  percolator_config:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "configs/percolator.config":
          type: file
          description: Percolator CLI configuration
          pattern: "configs/percolator.config"
  phi_report_config:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "configs/phi-report.config":
          type: file
          description: Philosopher filter/report CLI configuration
          pattern: "configs/phi-report.config"
  peptideprophet_config:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "configs/peptide-prophet.config":
          type: file
          description: PeptideProphet CLI configuration
          pattern: "configs/peptide-prophet.config"
  proteinprophet_config:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "configs/protein-prophet.config":
          type: file
          description: ProteinProphet CLI configuration
          pattern: "configs/protein-prophet.config"
  database_config:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "configs/database.config":
          type: file
          description: Philosopher database CLI configuration
          pattern: "configs/database.config"
  tmtintegrator_config:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "configs/tmtintegrator.yml":
          type: file
          description: TMTIntegrator YAML configuration
          pattern: "configs/tmtintegrator.yml"
  tmtintegrator_unmod_config:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "configs/tmtintegrator_unmod.yml":
          type: file
          description: TMTIntegrator YAML configuration for the unmodified-peptide run of FPOP TMT (optional)
          pattern: "configs/tmtintegrator_unmod.yml"
  all_configs:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "configs":
          type: directory
          description: Directory containing all generated config files
          pattern: "configs"
  versions_python:
    - - ${task.process}:
          type: string
          description: Process name
      - python:
          type: string
          description: Tool name
      - 'python3 --version 2>&1 | sed "s/Python //"':
          type: eval
          description: Version of Python

topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - python:
          type: string
          description: Tool name
      - 'python3 --version 2>&1 | sed "s/Python //"':
          type: eval
          description: Version of Python

