name: "percolator"
description: Semi-supervised learning for peptide identification using Percolator
keywords:
  - proteomics
  - mass spectrometry
  - FDR
  - false discovery rate
  - machine learning
  - PSM rescoring
tools:
  - percolator:
      description: |
        Percolator is a semi-supervised machine learning tool for peptide
        identification in shotgun proteomics. It uses a support vector machine
        to discriminate between correct and incorrect peptide-spectrum matches,
        enabling accurate FDR estimation.
      homepage: "http://percolator.ms/"
      documentation: "https://github.com/percolator/percolator/wiki"
      tool_dev_url: "https://github.com/percolator/percolator"
      doi: "10.1038/nmeth1113"
      licence: ["Apache-2.0"]
      identifier: biotools:percolator

input:
  - - meta:
        type: map
        description: Sample information; meta.data_type (FragPipe data type) is required
    - pin:
        type: file
        description: MSFragger PIN <stem>.pin (read by PercolatorOutputToPepXML)
    - edited_pin:
        type: file
        description: MSBooster <stem>_edited.pin, or [] when MSBooster did not run
    - pepxml_files:
        type: file
        description: MSFragger pepXML(s), ranked list for DDA+/DIA
    - spectra:
        type: file
        description: Searched LC-MS file
    - msfragger_mzml:
        type: file
        description: MSFragger _calibrated/_uncalibrated mzML, or []
    - has_calibrated_mzml:
        type: boolean
        description: msfragger.write_calibrated_mzml with calibrate_mass > 0
    - percolator_cli:
        type: string
        description: percolator.cmd-opts
    - min_prob:
        type: string
        description: percolator.min-prob as FragPipe prints it
    - keep_target_tsv:
        type: boolean
        description: Keep the target PSM TSV
    - keep_decoy_tsv:
        type: boolean
        description: Keep the decoy PSM TSV
    - has_crystalc:
        type: boolean
        description: Crystal-C ran (_c basename)
    - write_weights:
        type: boolean
        description: Write sub mzML is on; Percolator saves <stripped>_percolator.weights (CmdPercolator.java:180-183)
    - init_weights:
        type: file
        description: Second pass of Write sub mzML, the first pass's weights of the _sub.mzML input ([] when none; CmdPercolator.java:185-201)
        pattern: "*_percolator.weights"
  - decoy_tag:
      type: string
      description: Decoy protein prefix from the workflow's database.decoy-tag
output:
  results_dir:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}":
          type: directory
          description: Directory containing all Percolator output files and logs
  pepxml:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}/interact-*.pep.xml":
          type: file
          description: Rescored pepXML with probabilities from perc2pepxml conversion
          pattern: "interact-*.pep.xml"
  target_psms:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}/*_target_psms.tsv":
          type: file
          description: Target PSMs from Percolator
          pattern: "*_target_psms.tsv"
  decoy_psms:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}/*_decoy_psms.tsv":
          type: file
          description: Decoy PSMs from Percolator
          pattern: "*_decoy_psms.tsv"
  weights:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_percolator.weights":
          type: file
          description: Percolator feature weights for FragPipe's second pass (Write sub mzML)
          pattern: "*_percolator.weights"
  versions_percolator:
    - - ${task.process}:
          type: string
          description: Process name
      - percolator:
          type: string
          description: Tool name
      - fragpipeToolVersions().percolator:
          type: string
          description: Version of Percolator bundled with FragPipe; fixed value (fragpipeToolVersions()), held by the version-named binary tools/percolator_3_7_1/linux/percolator that the module checks exists
  versions_fragpipe:
    - - ${task.process}:
          type: string
          description: Process name
      - fragpipe:
          type: string
          description: Tool name
      - cat .fragpipe_version:
          type: eval
          description: Version of FragPipe

topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - percolator:
          type: string
          description: Tool name
      - fragpipeToolVersions().percolator:
          type: string
          description: Version of Percolator bundled with FragPipe; fixed value (fragpipeToolVersions()), held by the version-named binary tools/percolator_3_7_1/linux/percolator that the module checks exists
    - - ${task.process}:
          type: string
          description: Process name
      - fragpipe:
          type: string
          description: Tool name
      - cat .fragpipe_version:
          type: eval
          description: Version of FragPipe

authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
