name: iprophet
description: Philosopher iProphet over all validated pepXMLs as FragPipe CmdIprophet runs it
keywords:
  - proteomics
  - fragpipe
  - philosopher
tools:
  - philosopher:
      description: Philosopher toolkit bundled with FragPipe 24.0
      homepage: https://philosopher.nesvilab.org/
      licence:
        - GPL-3.0
input:
  - - meta:
        type: map
        description: Groovy Map with aggregate information
    - pepxml_files:
        type: file
        description: Validated pepXMLs of every group
    - pepxml_paths:
        type: list
        description: FragPipe work-dir location of each pepXML, in FragPipe order
    - iprophet_cli:
        type: string
        description: --decoy <tag> --nonsp --output combined
output:
  results_dir:
    - - meta:
          type: map
          description: Groovy Map with aggregate information
      - ${prefix}:
          type: directory
          description: iProphet outputs and iprophet.log
  pepxml:
    - - meta:
          type: map
          description: Groovy Map with aggregate information
      - ${prefix}/combined.pep.xml:
          type: file
          description: iProphet combined pepXML
  versions_philosopher:
    - - ${task.process}:
          type: string
          description: The name of the process
      - philosopher:
          type: string
          description: The name of the tool
      - fragpipeToolVersions().philosopher:
          type: string
          description: The Philosopher version bundled with FragPipe
  versions_fragpipe:
    - - ${task.process}:
          type: string
          description: The name of the process
      - fragpipe:
          type: string
          description: The name of the tool
      - cat .fragpipe_version:
          type: eval
          description: The expression to obtain the FragPipe version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - philosopher:
          type: string
          description: The name of the tool
      - fragpipeToolVersions().philosopher:
          type: string
          description: The Philosopher version bundled with FragPipe
    - - ${task.process}:
          type: string
          description: The name of the process
      - fragpipe:
          type: string
          description: The name of the tool
      - cat .fragpipe_version:
          type: eval
          description: The expression to obtain the FragPipe version
authors:
  - "@an-altosian"
maintainers:
  - "@an-altosian"
