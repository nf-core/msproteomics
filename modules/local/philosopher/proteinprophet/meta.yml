name: proteinprophet
description: Statistical protein inference using ProteinProphet
keywords:
  - proteomics
  - mass spectrometry
  - protein inference
  - probability
tools:
  - proteinprophet:
      description: "ProteinProphet is a statistical model for protein inference from

        peptide identifications. It handles shared peptides and computes

        protein-level probabilities considering peptide degeneracy.

        "
      homepage: https://proteinprophet.sourceforge.net/
      documentation: http://tools.proteomecenter.org/wiki/index.php?title=Software:ProteinProphet
      doi: 10.1021/ac0341261
      licence:
        - GPL-2.0
input:
  - - meta:
        type: map
        description: Aggregate information
    - pepxml_files:
        type: file
        description: Plain interact pepXMLs of every group
    - filelist_paths:
        type: list
        description: FragPipe work-dir location of each pepXML, in FragPipe order
    - proteinprophet_cli:
        type: string
        description: protein-prophet.cmd-opts
  - database:
      type: file
      description: The run's FASTA, staged so ProteinProphet can open the database named in the pepXML header (protein length, coverage)
      pattern: "*.{fasta,fas,fa}"
output:
  results_dir:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - ${prefix}:
          type: directory
          description: Directory containing ProteinProphet results and logs
  protxml:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - ${prefix}/*.prot.xml:
          type: file
          description: ProtXML with protein inference results
          pattern: combined.prot.xml
  versions_philosopher:
    - - ${task.process}:
          type: string
          description: The name of the process
      - philosopher:
          type: string
          description: The name of the tool
      - fragpipeToolVersions().philosopher:
          type: string
          description: The Philosopher version bundled with FragPipe
  versions_fragpipe:
    - - ${task.process}:
          type: string
          description: The name of the process
      - fragpipe:
          type: string
          description: The name of the tool
      - cat .fragpipe_version:
          type: eval
          description: The expression to obtain the FragPipe version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - philosopher:
          type: string
          description: The name of the tool
      - fragpipeToolVersions().philosopher:
          type: string
          description: The Philosopher version bundled with FragPipe
    - - ${task.process}:
          type: string
          description: The name of the process
      - fragpipe:
          type: string
          description: The name of the tool
      - cat .fragpipe_version:
          type: eval
          description: The expression to obtain the FragPipe version
authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
