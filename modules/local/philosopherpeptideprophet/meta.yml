name: philosopherpeptideprophet
description: Statistical validation of peptide assignments using PeptideProphet
keywords:
  - proteomics
  - mass spectrometry
  - FDR
  - peptide validation
  - probability
tools:
  - peptideprophet:
      description: "PeptideProphet is a statistical model for peptide assignment validation.

        It computes probabilities for peptide-spectrum matches based on search

        engine scores and assigns confidence levels to identifications.

        "
      homepage: https://peptideprophet.sourceforge.net/
      documentation: http://tools.proteomecenter.org/wiki/index.php?title=Software:PeptideProphet
      doi: 10.1021/ac025747h
      licence:
        - GPL-2.0
input:
  - - meta:
        type: map
        description: Sample (per-file) or group (combine) information
    - pepxml_files:
        type: file
        description: pepXML(s) to validate
    - spectra:
        type: file
        description: LC-MS files and MSFragger mzML for RewritePepxml
    - lcms_names:
        type: list
        description: Spectra names FragPipe passes to RewritePepxml
    - peptideprophet_cli:
        type: string
        description: cmd-opts with FragPipe enzyme flags
    - combine:
        type: boolean
        description: One --combine run for the group
  - fasta:
      type: file
      description: Protein sequence database (FASTA) with decoys
      pattern: "*.{fasta,fas,fa}"
  - decoy_tag:
      type: string
      description: Decoy protein prefix from workflow database.decoy-tag
output:
  results_dir:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - ${prefix}:
          type: directory
          description: Directory containing PeptideProphet results and logs
  pepxml:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - ${prefix}/interact*.pep.xml:
          type: file
          description: PepXML with probabilities
          pattern: interact-*.pep.xml
  versions_philosopher:
    - - ${task.process}:
          type: string
          description: The name of the process
      - philosopher:
          type: string
          description: The name of the tool
      - fragpipeToolVersions().philosopher:
          type: string
          description: The Philosopher version bundled with FragPipe; fixed value (fragpipeToolVersions()), held by the version-named binary tools/Philosopher/philosopher-v5.1.3-RC9 that the module checks exists
  versions_fragpipe:
    - - ${task.process}:
          type: string
          description: The name of the process
      - fragpipe:
          type: string
          description: The name of the tool
      - cat .fragpipe_version:
          type: eval
          description: The expression to obtain the FragPipe version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - philosopher:
          type: string
          description: The name of the tool
      - fragpipeToolVersions().philosopher:
          type: string
          description: The Philosopher version bundled with FragPipe; fixed value (fragpipeToolVersions()), held by the version-named binary tools/Philosopher/philosopher-v5.1.3-RC9 that the module checks exists
    - - ${task.process}:
          type: string
          description: The name of the process
      - fragpipe:
          type: string
          description: The name of the tool
      - cat .fragpipe_version:
          type: eval
          description: The expression to obtain the FragPipe version
authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
