name: "philosopherreport"
description: Generate TSV reports from Philosopher workspace binaries
keywords:
  - proteomics
  - report
  - PSM
  - peptide
  - protein
  - quantification
tools:
  - philosopher:
      description: "Philosopher report command generates TSV result files (PSM, peptide, protein, ion)

        from the .meta/ workspace binaries. When used after FreeQuant or LabelQuant,

        the generated TSVs contain correct quantification intensities.

        "
      homepage: https://philosopher.nesvilab.org/
      documentation: https://github.com/Nesvilab/philosopher/wiki
      tool_dev_url: https://github.com/Nesvilab/philosopher
      doi: 10.1038/s41592-020-0912-y
      licence:
        - GPL-3.0
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - results_dir:
        type: directory
        description: "Directory containing .meta/ workspace binaries from PHILOSOPHERFILTER

          (with skip_report=true) and updated by FREEQUANT/LabelQuant.

          "
    - report_cli:
        type: string
        description: CLI flags for philosopher report (e.g., "--msstats")
output:
  results_files:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - ${prefix}/*:
          type: file
          description: "Result files of the group (the directory holding them, with the .meta/ workspace,

            is the group's results directory: use the files' parent)

            "
          pattern: ${prefix}/*
  psms:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - ${prefix}/psm.tsv:
          type: file
          description: PSM-level results with quantification intensities
          pattern: psm.tsv
  peptides:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - ${prefix}/peptide.tsv:
          type: file
          description: Peptide-level results with quantification intensities
          pattern: peptide.tsv
  proteins:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - ${prefix}/protein.tsv:
          type: file
          description: Protein-level results with quantification intensities
          pattern: protein.tsv
  ions:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - ${prefix}/ion.tsv:
          type: file
          description: Ion-level results (optional)
          pattern: ion.tsv
  versions_philosopher:
    - - ${task.process}:
          type: string
          description: The name of the process
      - philosopher:
          type: string
          description: The name of the tool
      - fragpipeToolVersions().philosopher:
          type: string
          description: The Philosopher version bundled with FragPipe; fixed value (fragpipeToolVersions()), held by the version-named binary tools/Philosopher/philosopher-v5.1.3-RC9 that the module checks exists
  versions_fragpipe:
    - - ${task.process}:
          type: string
          description: The name of the process
      - fragpipe:
          type: string
          description: The name of the tool
      - cat .fragpipe_version:
          type: eval
          description: The expression to obtain the FragPipe version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - philosopher:
          type: string
          description: The name of the tool
      - fragpipeToolVersions().philosopher:
          type: string
          description: The Philosopher version bundled with FragPipe; fixed value (fragpipeToolVersions()), held by the version-named binary tools/Philosopher/philosopher-v5.1.3-RC9 that the module checks exists
    - - ${task.process}:
          type: string
          description: The name of the process
      - fragpipe:
          type: string
          description: The name of the tool
      - cat .fragpipe_version:
          type: eval
          description: The expression to obtain the FragPipe version
authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
