name: "philosopherworkspaceclean"
description: Remove the Philosopher .meta workspace of one FragPipe group work dir after its last Philosopher command (FragPipe's "Phi wrk clean")
keywords:
  - proteomics
  - philosopher
  - workspace
tools:
  - philosopher:
      description: "philosopher workspace --clean --nocheck deletes the .meta workspace directory

        (FragPipe CmdPhilosopherWorkspaceClean, Philosopher lib/wrk/wrk.go Clean).

        "
      homepage: https://philosopher.nesvilab.org/
      documentation: https://github.com/Nesvilab/philosopher/wiki
      tool_dev_url: https://github.com/Nesvilab/philosopher
      doi: 10.1038/s41592-020-0912-y
      licence:
        - GPL-3.0
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - results_dir:
        type: directory
        description: The group's final Philosopher directory (Filter with Report) with its .meta/ workspace
output:
  results_dir:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - ${prefix}:
          type: directory
          description: Copy of the group directory without the .meta/ workspace
          pattern: ${prefix}
  versions_philosopher:
    - - ${task.process}:
          type: string
          description: The name of the process
      - philosopher:
          type: string
          description: The name of the tool
      - fragpipeToolVersions().philosopher:
          type: string
          description: The Philosopher version bundled with FragPipe; fixed value (fragpipeToolVersions()), held by the version-named binary tools/Philosopher/philosopher-v5.1.3-RC9 that the module checks exists
  versions_fragpipe:
    - - ${task.process}:
          type: string
          description: The name of the process
      - fragpipe:
          type: string
          description: The name of the tool
      - cat .fragpipe_version:
          type: eval
          description: The expression to obtain the FragPipe version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - philosopher:
          type: string
          description: The name of the tool
      - fragpipeToolVersions().philosopher:
          type: string
          description: The Philosopher version bundled with FragPipe; fixed value (fragpipeToolVersions()), held by the version-named binary tools/Philosopher/philosopher-v5.1.3-RC9 that the module checks exists
    - - ${task.process}:
          type: string
          description: The name of the process
      - fragpipe:
          type: string
          description: The name of the tool
      - cat .fragpipe_version:
          type: eval
          description: The expression to obtain the FragPipe version
authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
