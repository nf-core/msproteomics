name: "ptmprophet"
description: PTM site localization using PTMProphet from the Trans-Proteomic Pipeline
keywords:
  - proteomics
  - mass spectrometry
  - post-translational modifications
  - PTM localization
  - site localization
tools:
  - ptmprophet:
      description: |
        PTMProphet is a tool for PTM (post-translational modification) site
        localization from peptide search results. It computes probabilities
        for the precise localization of modifications on peptide sequences
        using pepXML search results as input.
      homepage: "http://tools.proteomecenter.org/wiki/index.php?title=Software:TPP"
      documentation: "http://tools.proteomecenter.org/wiki/index.php?title=Software:TPP"
      tool_dev_url: "https://sourceforge.net/projects/sashimi/"
      licence: ["GPL-2.0"]

input:
  - - meta:
        type: map
        description: Sample information
    - pepxml_file:
        type: file
        description: One validated interact .pep.xml
    - spectra:
        type: file
        description: The LC-MS files the pepXML refers to (the searched file and MSFragger's mzML); RewritePepxml points base_name at these staged copies
        pattern: "*.{mzML,mzXML,raw,d}"
    - lcms_names:
        type: string
        description: The names FragPipe writes as base_name in the pepXML
    - ptmprophet_cli:
        type: string
        description: PtmProphetPanel.getCmdLineOpts() options, "--" style already translated by parse_fragpipe_workflow.py
output:
  results_dir:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}":
          type: directory
          description: Directory containing PTMProphet results and log files
          pattern: "${prefix}"
  mod_pepxml:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}/*.mod.pep.xml":
          type: file
          description: Modified pepXML with PTM site localization probabilities
          pattern: "*.mod.pep.xml"
  versions_ptmprophet:
    - - ${task.process}:
          type: string
          description: Process name
      - ptmprophet:
          type: string
          description: Tool name
      - fragpipeToolVersions().ptmprophet:
          type: string
          description: Version of PTMProphet bundled with FragPipe
  versions_fragpipe:
    - - ${task.process}:
          type: string
          description: Process name
      - fragpipe:
          type: string
          description: Tool name
      - cat .fragpipe_version:
          type: eval
          description: Version of FragPipe

topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - ptmprophet:
          type: string
          description: Tool name
      - fragpipeToolVersions().ptmprophet:
          type: string
          description: Version of PTMProphet bundled with FragPipe
    - - ${task.process}:
          type: string
          description: Process name
      - fragpipe:
          type: string
          description: Tool name
      - cat .fragpipe_version:
          type: eval
          description: Version of FragPipe

authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
