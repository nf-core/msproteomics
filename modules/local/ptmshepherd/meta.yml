name: "ptmshepherd"
description: Open search analysis and PTM characterization with PTM-Shepherd
keywords:
  - proteomics
  - mass spectrometry
  - post-translational modifications
  - open search
  - mass shift analysis
tools:
  - ptmshepherd:
      description: |
        PTM-Shepherd is a bioinformatics tool for characterization of post-translational
        and chemical modifications from open search results. It performs mass shift
        annotation, localization, and generates modification summaries and profiles
        across samples. Supports glycoproteomics analysis and diagnostic ion mining.
      homepage: "https://github.com/Nesvilab/PTM-Shepherd"
      documentation: "https://github.com/Nesvilab/PTM-Shepherd/wiki"
      tool_dev_url: "https://github.com/Nesvilab/PTM-Shepherd"
      doi: "10.1021/acs.jproteome.0c00688"
      licence: ["GPL-3.0"]

input:
  - - meta:
        type: map
        description: Aggregate metadata map
    - psm_dirs:
        type: directory
        description: One directory per FragPipe group (named meta.id of the group) with psm.tsv
    - datasets:
        type: list
        description: "[directory name, dataset name] per group in FragPipe's order; dataset01 for the blank group"
    - mzml_files:
        type: file
        description: LC-MS files of all groups
    - config_text:
        type: string
        description: shepherd.config property block from PARSEFRAGPIPEWORKFLOW (@THREADS@, @TOOLS_DIR@ and @ANNOTATION_FILE@ tokens)
    - annotation_file:
        type: file
        description: Custom annotation file of ptmshepherd.annotation_file, staged as annotation/<name> and named by the config's annotation_file line; empty list when the value is a keyword (unimod, common)
        pattern: "*"
  - fasta:
      type: file
      description: Searched protein database

output:
  psm_dirs:
    - - meta:
          type: map
          description: Aggregate metadata map
      - "groups/*":
          type: directory
          description: Copies of the group directories with PTM-Shepherd's psm.tsv
  results_dir:
    - - meta:
          type: map
          description: Aggregate metadata map
      - "ptm-shepherd-output":
          type: directory
          description: All PTM-Shepherd output
  glyco_masses:
    - - meta:
          type: map
          description: Aggregate metadata map
      - "ptm-shepherd-output/glyco_masses_list.txt":
          type: file
          description: Glycan masses for AppendFile (glycan assignment only)
  config:
    - - meta:
          type: map
          description: Aggregate metadata map
      - "shepherd.config":
          type: file
          description: Config PTM-Shepherd ran with
  log:
    - - meta:
          type: map
          description: Aggregate metadata map
      - "ptmshepherd.log":
          type: file
          description: PTM-Shepherd command and output
  versions_ptmshepherd:
    - - ${task.process}:
          type: string
          description: Process name
      - ptmshepherd:
          type: string
          description: Tool name
      - fragpipeToolVersions().ptmshepherd:
          type: string
          description: Version of PTM-Shepherd bundled with FragPipe; fixed value (fragpipeToolVersions()), held by the version-named jar tools/ptmshepherd-3.0.11.jar that the module checks exists
  versions_fragpipe:
    - - ${task.process}:
          type: string
          description: Process name
      - fragpipe:
          type: string
          description: Tool name
      - cat .fragpipe_version:
          type: eval
          description: Version of FragPipe

topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - ptmshepherd:
          type: string
          description: Tool name
      - fragpipeToolVersions().ptmshepherd:
          type: string
          description: Version of PTM-Shepherd bundled with FragPipe; fixed value (fragpipeToolVersions()), held by the version-named jar tools/ptmshepherd-3.0.11.jar that the module checks exists
    - - ${task.process}:
          type: string
          description: Process name
      - fragpipe:
          type: string
          description: Tool name
      - cat .fragpipe_version:
          type: eval
          description: Version of FragPipe

authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
