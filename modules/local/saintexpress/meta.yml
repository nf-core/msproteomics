name: saintexpress
description: Scoring protein-protein interactions from AP-MS data with SAINTexpress
keywords:
  - proteomics
  - mass spectrometry
  - protein-protein interactions
  - AP-MS
  - affinity purification
  - scoring
tools:
  - saintexpress:
      description: "SAINTexpress is a computational tool for scoring protein-protein

        interactions from affinity purification-mass spectrometry (AP-MS)

        experiments. It uses a statistical model to evaluate the significance

        of prey proteins identified in bait purifications, supporting both

        spectral count and intensity-based scoring modes.

        "
      homepage: https://saint-apms.sourceforge.net/Main.html
      documentation: https://saint-apms.sourceforge.net/Main.html
      tool_dev_url: https://sourceforge.net/projects/saint-apms/
      doi: 10.1016/j.jprot.2013.10.023
      licence:
        - Academic
input:
  - - meta:
        type: map
        description: Aggregate information
    - saint_input:
        type: file
        description: inter.dat, bait.dat and prey.dat (REPRINTTOSAINTINPUT)
    - mode:
        type: string
        description: spc or int
    - saint_cli:
        type: string
        description: -R<max-replicates> -L<virtual-controls>
    - cmd_opts:
        type: string
        description: saintexpress.cmd-opts, one argument
output:
  results_dir:
    - - meta:
          type: map
          description: Aggregate information
      - saintexpress-${mode}:
          type: directory
          description: inter/bait/prey.dat, list.txt and saintexpress.log
  results_list:
    - - meta:
          type: map
          description: Aggregate information
      - saintexpress-${mode}/list.txt:
          type: file
          description: SAINTexpress scores
  versions_saintexpress:
    - - ${task.process}:
          type: string
          description: Process name
      - saintexpress:
          type: string
          description: Tool name
      - fragpipeToolVersions().saintexpress:
          type: string
          description: 'Version of SAINTexpress bundled with FragPipe; fixed value (fragpipeToolVersions()): tools/SAINTexpress/SAINTexpress-<mode> has no version in its path; FragPipe 24.0 ships SAINTexpress 3.6.1 (it prints "SAINT express version 3.6.1")'
  versions_fragpipe:
    - - ${task.process}:
          type: string
          description: Process name
      - fragpipe:
          type: string
          description: Tool name
      - cat .fragpipe_version:
          type: eval
          description: Version of FragPipe
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - saintexpress:
          type: string
          description: Tool name
      - fragpipeToolVersions().saintexpress:
          type: string
          description: 'Version of SAINTexpress bundled with FragPipe; fixed value (fragpipeToolVersions()): tools/SAINTexpress/SAINTexpress-<mode> has no version in its path; FragPipe 24.0 ships SAINTexpress 3.6.1 (it prints "SAINT express version 3.6.1")'
    - - ${task.process}:
          type: string
          description: Process name
      - fragpipe:
          type: string
          description: Tool name
      - cat .fragpipe_version:
          type: eval
          description: Version of FragPipe

authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
