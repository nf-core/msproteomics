# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "sortfasta"
description: Sort the proteins of a FASTA file as FragPipe's msfragger_pep_split.py does for the calibration search
keywords:
  - fasta
  - msfragger
  - split database
tools:
  - "python":
      description: "Python interpreter running sort_fasta.py (port of msfragger_pep_split.py sample_fasta)"
      homepage: "https://www.python.org"
      licence: ["PSF-2.0"]
input:
  - fasta:
      type: file
      description: Protein database
      pattern: "*.{fasta,fa,fas}"
output:
  fasta:
    - "sorted_${fasta.name}":
        type: file
        description: The FASTA with its proteins sorted bytewise
        pattern: "sorted_*"
  versions_python:
    - - ${task.process}:
          type: string
          description: Process name
      - python:
          type: string
          description: Tool name
      - 'python3 --version 2>&1 | sed "s/Python //"':
          type: eval
          description: Version of Python

topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - python:
          type: string
          description: Tool name
      - 'python3 --version 2>&1 | sed "s/Python //"':
          type: eval
          description: Version of Python

authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
containers:
  conda:
    linux/amd64:
      lock_file: modules/local/sortfasta/.conda-lock/linux_amd64-bd-27a817c2c0890658_1.txt
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/python:3.12.13--27a817c2c0890658
      build_id: bd-27a817c2c0890658_1
      scan_id: sc-e07391e6e5fbddf7_1
  singularity:
