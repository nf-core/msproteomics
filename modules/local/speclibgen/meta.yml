name: "speclibgen"
description: |
  FragPipe's spectral library generation step: runs FragPipe's own tools/speclib/gen_con_spec_lib.py
  (FragPipe-SpecLib convert/convertpsm + library + easypqp_lib_export) with the argv and group work
  dir layout of CmdSpecLibGen.java.
keywords:
  - proteomics
  - mass spectrometry
  - spectral library
  - EasyPQP
  - DIA
tools:
  - speclibgen:
      description: |
        gen_con_spec_lib.py from the FragPipe 24.0 tools directory. With --decoy_prefix in the convert
        extras it converts psm.tsv rows (convertpsm), otherwise the validated pepXMLs (convert --pepxml).
        It aligns retention times (automatic, Biognosys/ciRT/Pierce iRT or a user file), builds the
        EasyPQP library and post-processes it into the Spectronaut-style library.tsv that DIA-NN reads.
      homepage: "https://fragpipe.nesvilab.org/"
      documentation: "https://fragpipe.nesvilab.org/docs/tutorial_speclib.html"
      tool_dev_url: "https://github.com/Nesvilab/FragPipe"
      licence: ["GPL-3.0"]

input:
  - - meta:
        type: map
        description: Groovy Map of the FragPipe group (e.g. [ id:'fragpipe' ])
    - psm:
        type: file
        description: The group's psm.tsv from Philosopher (staged as psm.tsv)
        pattern: "psm.tsv"
    - peptide:
        type: file
        description: The group's peptide.tsv from Philosopher (staged as peptide.tsv)
        pattern: "peptide.tsv"
    - pepxml_files:
        type: file
        description: Validated pepXML files (interact-*.pep.xml, or PTMProphet *.mod.pep.xml)
        pattern: "*.pep.xml"
    - spectra:
        type: file
        description: LC-MS files written to filelist_speclibgen.txt (MSFragger's _uncalibrated.mzML for .raw / timsTOF .d)
        pattern: "*.{mzML,mzXML,mgf,d}"
    - rt_cal_file:
        type: file
        description: User RT calibration file ("User provided RT calibration file"), [] otherwise
        pattern: "*.{tsv,txt}"
    - im_cal_file:
        type: file
        description: User IM calibration file ("User provided IM calibration file"), [] otherwise
        pattern: "*.{tsv,txt}"
    - argv_parts:
        type: map
        description: gen_con_spec_lib.py argv values from PARSEFRAGPIPEWORKFLOW (speclibgen.argv_parts - rt_cal, im_cal, convert_args, library_args, intermediate)
  - fasta:
      type: file
      description: Protein database with decoys (gen_con_spec_lib.py argv[1])
      pattern: "*.{fasta,fas,fa}"

output:
  library_tsv:
    - - meta:
          type: map
          description: Groovy Map of the FragPipe group
      - library.tsv:
          type: file
          description: Spectral library after easypqp_lib_export('Spectronaut'), the DIA-NN input
          pattern: "library.tsv"
  easypqp_files:
    - - meta:
          type: map
          description: Groovy Map of the FragPipe group
      - easypqp_files:
          type: directory
          description: cmds.txt and the RT/IM alignment PDFs
          pattern: "easypqp_files"
  rt_reference:
    - - meta:
          type: map
          description: Groovy Map of the FragPipe group
      - easypqp_rt_reference_run.tsv:
          type: file
          description: EasyPQP reference run RT table (automatic RT calibration)
          pattern: "easypqp_rt_reference_run.tsv"
  filelists:
    - - meta:
          type: map
          description: Groovy Map of the FragPipe group
      - filelist_*.txt:
          type: file
          description: filelist_speclibgen.txt and filelist_easypqp_library.txt
          pattern: "filelist_*.txt"
  argv:
    - - meta:
          type: map
          description: Groovy Map of the FragPipe group
      - speclibgen_argv.txt:
          type: file
          description: The gen_con_spec_lib.py command, one argument per line
          pattern: "speclibgen_argv.txt"
  intermediates:
    - - meta:
          type: map
          description: Groovy Map of the FragPipe group
      - "{irt.tsv,im.tsv,*_temp-psm.tsv,*.psmpkl,*.peakpkl,*_run_peaks.tsv,easypqp_lib_openswath.tsv}":
          type: file
          description: Calibration references, per-run psm.tsv splits and, with keep_intermediate_files, the EasyPQP intermediates
          pattern: "*"
  versions_speclibgen:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - fragpipe-speclib:
          type: string
          description: The tool name
      - fragpipeToolVersions().fragpipe_speclib:
          type: string
          description: FragPipe-SpecLib version pinned by FragPipe 24.0 (python/python_packages/requirements.txt), checked against pip show at run time
  versions_fragpipe:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - fragpipe:
          type: string
          description: The tool name
      - cat .fragpipe_version:
          type: eval
          description: FragPipe version of the tools directory

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - fragpipe-speclib:
          type: string
          description: The tool name
      - fragpipeToolVersions().fragpipe_speclib:
          type: string
          description: The tool version
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - fragpipe:
          type: string
          description: The tool name
      - cat .fragpipe_version:
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
