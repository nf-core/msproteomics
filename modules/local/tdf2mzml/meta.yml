name: tdf2mzml
description: Convert raw Bruker files to mzML files
keywords:
  - raw
  - mzML
  - .d
tools:
  - tdf2mzml:
      description: |
        It takes a Bruker .d raw file as input and outputs indexed mzML
      homepage: https://github.com/mafreitas/tdf2mzml
      documentation: https://github.com/mafreitas/tdf2mzml
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - rawfile:
        type: file
        description: Bruker raw file archived using tar
        pattern: "*.d.tar"
        ontologies: []
output:
  mzmls_converted:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - ${rawfile.baseName}.mzML:
          type: file
          description: Converted mzML file
          pattern: "*.mzML"
          ontologies: []
  log:
    - "*.log":
        type: file
        description: Log file from conversion
        pattern: "*.log"
        ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies: []

topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies: []

authors:
  - "@jspaezp"
