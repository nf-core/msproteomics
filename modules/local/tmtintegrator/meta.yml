name: tmtintegrator
description: TMT-Integrator for isobaric labeling quantification
keywords:
  - proteomics
  - quantification
  - TMT
  - isobaric
  - mass-spectrometry
tools:
  - tmtintegrator:
      description: |
        TMT-Integrator extracts and combines channel abundances from multiple
        TMT-labeled samples, producing comprehensive quantification reports
        at gene, protein, peptide, and PTM site levels.
      homepage: https://github.com/Nesvilab/TMT-Integrator
      documentation: https://fragpipe.nesvilab.org/docs/tutorial_tmt.html
      licence: ["Apache-2.0"]
      note: Runs from the FragPipe image (--fragpipe_container).

input:
  - - meta:
        type: map
        description: Groovy Map with the run's metadata, e.g. [ id:'fragpipe' ]
    - group_dirs:
        type: directory
        description: One directory per FragPipe group holding its psm.tsv and protein.tsv, staged under input_results/
    - root_group_dir:
        type: string
        description: The group_dirs name holding FragPipe's blank group, '' when there is none
    - msstats_annotation:
        type: file
        description: MSstatsTMT_annotation.csv (WRITETEXTFILE), [] when Philosopher MSstats is off
        pattern: "MSstatsTMT_annotation.csv"
  - config_text:
      type: string
      description: "tmt-integrator-conf.yml text from PARSEFRAGPIPEWORKFLOW, with the line `output: @TMT_REPORT_DIR@`"

output:
  results_dir:
    - - meta:
          type: map
          description: Sample metadata
      - "${work_dir}/${report_dir}":
          type: directory
          description: TMT-Integrator output directory
          pattern: "*/tmt-report"
  abundance:
    - - meta:
          type: map
          description: Sample metadata
      - "${work_dir}/${report_dir}/abundance_*.tsv":
          type: file
          description: Abundance tables at various levels (gene, protein, peptide)
          pattern: "*/tmt-report/abundance_*.tsv"
  ratio:
    - - meta:
          type: map
          description: Sample metadata
      - "${work_dir}/${report_dir}/ratio_*.tsv":
          type: file
          description: Ratio tables (log2 fold changes)
          pattern: "*/tmt-report/ratio_*.tsv"
  config:
    - - meta:
          type: map
          description: Sample metadata
      - "${work_dir}/${config_name}":
          type: file
          description: tmt-integrator-conf.yml as TMT-Integrator read it (output path filled in)
          pattern: "*/tmt-integrator-conf*.yml"
  msstats_annotation:
    - - meta:
          type: map
          description: Sample metadata
      - "${work_dir}/MSstatsTMT_annotation.csv":
          type: file
          description: MSstatsTMT annotation in the work dir (Philosopher MSstats on)
          pattern: "*/MSstatsTMT_annotation.csv"
  versions_tmtintegrator:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - tmtintegrator:
          type: string
          description: The tool name
      - fragpipeToolVersions().tmtintegrator:
          type: string
          description: TMT-Integrator version pinned by the FragPipe 24.0 tools directory
  versions_fragpipe:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - fragpipe:
          type: string
          description: The tool name
      - cat .fragpipe_version:
          type: eval
          description: FragPipe version of the tools directory

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - tmtintegrator:
          type: string
          description: The tool name
      - fragpipeToolVersions().tmtintegrator:
          type: string
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - fragpipe:
          type: string
          description: The tool name
      - cat .fragpipe_version:
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
