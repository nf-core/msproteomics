# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "fragpipe_wf"
description: General FragPipe orchestration subworkflow that composes all focused subworkflows into a complete proteomics analysis pipeline
keywords:
  - proteomics
  - fragpipe
  - mass-spectrometry
  - database-search
  - quantification
  - pipeline
components:
  - parsefragpipeworkflow
  - shouldruntool
  - fragpipe_database
  - fragpipe_convert
  - fragpipe_search
  - fragpipe_validate
  - fragpipe_inference
  - fragpipe_ptm
  - fragpipe_quant
  - fragpipe_speclib
  - fragpipe_glyco
  - fragpipe_export
  - checkcentroid
  - fragpipe_matched_fragments_inputs
  - fragpipe_philosopher_quant
  - writesubmzml
input:
  - ch_file:
      type: channel
      description: |
        Sample files for analysis.
        Structure: [ val(sample_meta), path(mzml/raw/d) ]
  - ch_database:
      type: channel
      description: |
        Protein database FASTA file (empty channel if prebuilt philosopher database provided).
        Structure: [ val(meta), path(fasta) ]
  - ch_workflow_file:
      type: channel
      description: |
        FragPipe workflow file containing all tool parameters.
        Structure: [ val(meta), path(workflow_file) ]
  - ch_decoy_db:
      type: channel
      description: |
        Prebuilt philosopher database with decoys (empty channel if not provided,
        in which case FRAGPIPE_DATABASE will be run on ch_database).
        Structure: [ val(meta), path(fasta) ]
  - ch_annotation:
      type: channel
      description: |
        Annotation file for TMT/IsoQuant quantification. Pass [] when not used.
        Structure: path(annotation_file)
  - ch_manifest:
      type: channel
      description: |
        FragPipe manifest file for glycoproteomics workflows. Pass [] when not used.
        Structure: path(manifest.fp-manifest)
output:
  - searched_lcms:
      type: channel
      description: |
        The LC-MS file MSFragger searched.
        Structure: [ val(meta), path(file) ]
  - mzml:
      type: channel
      description: |
        Converted spectra files (mzML or .d).
        Structure: [ val(meta), path(mzml) ]
  - pepxml:
      type: channel
      description: |
        Search result pepXML files from FRAGPIPE_SEARCH.
        Structure: [ val(meta), path(pepxml) ]
  - pin:
      type: channel
      description: |
        Percolator input (PIN) files from FRAGPIPE_SEARCH.
        Structure: [ val(meta), path(pin) ]
  - database:
      type: channel
      description: |
        The run database (decoys, contaminants).
        Structure: path(fasta)
  - msfragger_logs:
      type: channel
      description: |
        MSFragger console output.
        Structure: [ val(meta), path(log) ]
  - sub_mzml:
      type: channel
      description: |
        Write sub mzML (tab-run.write_sub_mzml): the scans of each LC-MS file without a PSM above the threshold.
        Structure: [ val(meta), path(<stem>_sub.mzML) ]
  - validated_pepxml:
      type: channel
      description: |
        Validated pepXML files from FRAGPIPE_VALIDATE.
        Structure: [ val(meta), path(pepxml) ]
  - protxml:
      type: channel
      description: |
        ProteinProphet combined protein inference XML.
        Structure: [ val(meta), path(combined.prot.xml) ]
  - psms:
      type: channel
      description: |
        Per-sample PSM tables from Philosopher Filter.
        Structure: [ val(meta), path(psm.tsv) ]
  - peptides:
      type: channel
      description: |
        Per-sample peptide tables from Philosopher Filter.
        Structure: [ val(meta), path(peptide.tsv) ]
  - proteins:
      type: channel
      description: |
        Per-sample protein tables from Philosopher Filter.
        Structure: [ val(meta), path(protein.tsv) ]
  - results_dir:
      type: channel
      description: |
        Per-sample results directories from Philosopher Filter.
        Structure: [ val(meta), path(results_dir) ]
  - combined_protein:
      type: channel
      description: |
        Combined protein quantification table from IonQuant.
        Structure: [ val(meta), path(combined_protein.tsv) ]
  - combined_peptide:
      type: channel
      description: |
        Combined peptide quantification table from IonQuant.
        Structure: [ val(meta), path(combined_peptide.tsv) ]
  - combined_ion:
      type: channel
      description: |
        Combined ion quantification table from IonQuant.
        Structure: [ val(meta), path(combined_ion.tsv) ]
  - ionquant_dir:
      type: channel
      description: |
        IonQuant results directory.
        Structure: [ val(meta), path(results_dir) ]
  - tmt_abundance:
      type: channel
      description: |
        TMT abundance tables from TMTIntegrator.
        Structure: [ val(meta), path(abundance_*.tsv) ]
  - tmt_dir:
      type: channel
      description: |
        TMTIntegrator results directory.
        Structure: [ val(meta), path(tmt-report) ]
  - ptm_results:
      type: channel
      description: |
        PTMShepherd results directory.
        Structure: [ val(meta), path(results_dir) ]
  - glyco_psm_dirs:
      type: channel
      description: |
        Glyco psm dirs.
        Structure: [ val(meta), path(group_dir) ]
  - speclib:
      type: channel
      description: |
        Generated spectral library from SPECLIBGEN.
        Structure: [ val(meta), path(library.speclib) ]
  - diann_report:
      type: channel
      description: |
        Diann report.
        Structure: [ val(meta), path(report.tsv) ]
  - diann_pg_matrix:
      type: channel
      description: |
        Diann pg matrix.
        Structure: [ val(meta), path(report.pg_matrix.tsv) ]
  - diann_results:
      type: channel
      description: |
        Diann results.
        Structure: [ val(meta), [ path(dia-quant-output/*) ] ]
  - taxonomy_results:
      type: channel
      description: |
        Metaproteomics taxonomy assignment results.
        Structure: [ val(meta), path(results_dir) ]
  - fpop_results:
      type: channel
      description: |
        Fpop results.
        Structure: [ val(meta), path(results_dir) ]
  - fpop_psms:
      type: channel
      description: |
        Fpop psms.
        Structure: [ val(meta), path(psm.tsv) ]
  - fpop_diann_report:
      type: channel
      description: |
        Fpop diann report.
        Structure: [ val(meta), path(report.tsv) ]
  - versions:
      type: channel
      description: |
        Software versions (topic tuples).
        Structure: [ val(process), val(tool), val(version) ]
authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
