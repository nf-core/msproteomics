# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "fragpipe_convert"
description: Optionally preprocesses DIA data with DIA-Umpire or diaTracer; LC-MS files are searched as given (no conversion), as in FragPipe
keywords:
  - proteomics
  - file-conversion
  - mzml
  - dia
  - diaumpire
  - diatracer
components:
  - diaumpire
  - diatracer
input:
  - ch_file:
      type: channel
      description: |
        LC-MS files in a format MSFragger reads (.raw, .mzML, .mzXML, .mgf, .mzBIN, Bruker .d);
        any other file fails the run.
        Structure: [ val(meta), path(lcms_file) ]
  - ch_tool_configs:
      type: channel
      description: |
        Parsed JSON tool configuration map controlling which conversion and DIA preprocessing tools to run.
        Structure: val(tool_configs_map)
output:
  - mzml:
      type: channel
      description: |
        LC-MS files to search: the input files, with DIA files replaced by their DIA-Umpire or diaTracer pseudo-spectra.
        Structure: [ val(meta), path(spectra) ]
  - umpire_mzml:
      type: channel
      description: |
        DIA-Umpire pseudo-spectra (FragPipe writes them to its work dir).
        Structure: [ val(meta), path(mzml) ]
  - versions:
      type: channel
      description: |
        Software versions (topic tuples).
        Structure: [ val(process), val(tool), val(version) ]
authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
