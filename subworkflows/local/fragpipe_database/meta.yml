# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "fragpipe_database"
description: The protein database FragPipe searches, as given or after FragPipe's database update (--add_philosopher_decoy / --add_philosopher_contaminants)
keywords:
  - proteomics
  - database
  - fasta
  - decoy
  - contaminants
  - philosopher
components:
  - philosopherdatabase
input:
  - ch_fasta:
      type: channel
      description: |
        FASTA to update with FragPipe's "Add decoys" (philosopher database --custom);
        empty unless --add_philosopher_decoy / --add_philosopher_contaminants.
        Structure: [ val(meta), path(fasta) ]
  - ch_prebuilt_db:
      type: channel
      description: |
        FASTA searched as given, as FragPipe headless searches database.db-path
        (empty when ch_fasta is used).
        Structure: [ val(meta), path(fasta) ]
output:
  - fasta:
      type: channel
      description: |
        The run database.
        Structure: [ val(meta), path(prepared_fasta) ]
  - fasta_path:
      type: channel
      description: |
        Value channel of the prepared FASTA path for broadcasting to multiple downstream processes.
        Structure: path(fasta)
authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
