# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "fragpipe_export"
description: Export and specialized analysis modules including SAINT AP-MS scoring, FPOP analysis, and metaproteomics taxonomic assignment
keywords:
  - proteomics
  - export
  - saint
  - fpop
  - metaproteomics
  - taxonomy
components:
  - saintexpress
  - fpop
  - metaproteomics
  - fpopcoadaptr
  - reprinttosaintinput
input:
  - ch_fasta:
      type: channel
      description: |
        Protein database FASTA as a value channel for broadcasting.
        Structure: path(fasta)
  - ch_psm_tables:
      type: channel
      description: |
        psm.tsv tables per fpopCoadaptrSource, for FPOP coADAPTr.
        Structure: [ val(source), val(layout), [ path(dir), ... ] ]
  - ch_diann_report:
      type: channel
      description: |
        DIA-NN report for FPOP coADAPTr in DIA mode.
        Structure: [ val(meta), path(dia-quant-output/report.tsv) ]
  - ch_fpop_inputs:
      type: channel
      description: |
        FPOP Quant inputs; [] for an absent file.
        Structure: [ path(modpep_tsv), path(tmt-report), path(tmt-report-unmod) ]
  - ch_meta_files:
      type: channel
      description: |
        MSFragger .pin and Percolator *_psms.tsv files for Metaproteomics.
        Structure: [ path(file), ... ]
  - ch_taxon_files:
      type: channel
      description: |
        NCBI taxonomy files for metaproteomics; [] for an absent file.
        Structure: [ path(names.dmp), path(nodes.dmp) ]
  - ch_saint_files:
      type: channel
      description: |
        REPRINT tables of the work dir, for SAINT.
        Structure: [ val(mode), path(reprint.<mode>.tsv) ]
  - ch_tool_configs:
      type: channel
      description: |
        Parsed JSON tool configuration map controlling which export tools to run.
        Structure: val(tool_configs_map)
  - aggregate_meta:
      type: value
      description: |
        Metadata map for aggregate outputs (e.g., [id: 'fragpipe']).
output:
  - saint_results:
      type: channel
      description: |
        SAINTexpress interaction scoring results.
        Structure: [ val(meta), path(list.txt) ]
  - saint_skipped:
      type: channel
      description: |
        SAINT modes FragPipe skips for a missing reprint table.
        Structure: [ val(meta), path(skipped_mode.txt) ]
  - fpop_results:
      type: channel
      description: |
        FPOP analysis results directory.
        Structure: [ val(meta), path(results_dir) ]
  - fpop_psms:
      type: channel
      description: |
        psm.tsv with the FPOP Modifications column (FPOP coADAPTr).
        Structure: [ val(meta), path(psm.tsv) ]
  - fpop_diann_report:
      type: channel
      description: |
        DIA-NN report.tsv edited by FPOP coADAPTr.
        Structure: [ val(meta), path(report.tsv) ]
  - taxonomy_results:
      type: channel
      description: |
        Metaproteomics taxonomic assignment results directory.
        Structure: [ val(meta), path(results_dir) ]
authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
