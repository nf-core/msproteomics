# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "fragpipe_glyco"
description: FragPipe glyco chain between Philosopher Report and IonQuant - PairScans, O-Pair, PTM-Shepherd (with AppendFile masses) and MBG, each on a copy of the group psm.tsv
keywords:
  - proteomics
  - glycoproteomics
  - opair
  - ptmshepherd
  - mbg
components:
  - pairscans
  - opair
  - ptmshepherd
  - mbg
  - fragpipe_ptm
input:
  - ch_results_dir:
      type: channel
      description: "Philosopher Report group directories. Structure: [ val(meta), path(group_dir) ]"
  - ch_lcms:
      type: channel
      description: "LC-MS files in FragPipe file-table order. Structure: [ val(meta), path(spectra) ]"
  - ch_mzml:
      type: channel
      description: "LC-MS files MSFragger searched. Structure: [ val(meta), path(spectra) ]"
  - ch_calibrated_mzml:
      type: channel
      description: "MSFragger _calibrated.mzML. Structure: [ val(meta), path(mzml) ]"
  - ch_uncalibrated_mzml:
      type: channel
      description: "MSFragger _uncalibrated.mzML. Structure: [ val(meta), path(mzml) ]"
  - ch_fasta:
      type: channel
      description: "Searched database. Structure: path(fasta)"
  - ch_tool_configs:
      type: channel
      description: "PARSEFRAGPIPEWORKFLOW tool_configs.json text. Structure: val(json)"
  - aggregate_meta:
      type: map
      description: Meta map of aggregate outputs
output:
  - modlist_append:
      type: channel
      description: "glyco_masses_list.txt for IonQuant AppendFile, or []. Structure: path(file)"
  - psm_dirs:
      type: channel
      description: "Group directories after the chain (IonQuant/SpecLibGen input). Structure: [ val(meta), path(group_dir) ]"
  - ptm_results:
      type: channel
      description: "ptm-shepherd-output. Structure: [ val(meta), path(dir) ]"
  - glyco_masses:
      type: channel
      description: "Structure: [ val(meta), path(glyco_masses_list.txt) ]"
  - shepherd_config:
      type: channel
      description: "Structure: [ val(meta), path(shepherd.config) ]"
  - pairs:
      type: channel
      description: "Structure: [ val(meta), path(*.pairs) ]"
  - opair_dirs:
      type: channel
      description: "Structure: [ val(meta), path(group_dir) ]"
  - mbg_dirs:
      type: channel
      description: "Structure: [ val(meta), path(group_dir) ]"
  - mbg_manifest:
      type: channel
      description: "Structure: [ val(meta), path(fragpipe-files.fp-manifest) ]"
  - mbg_log:
      type: channel
      description: "Structure: [ val(meta), path(mbg.log) ]"
  - opair_log:
      type: channel
      description: "Structure: [ val(meta), path(opair.log) ]"
  - versions:
      type: channel
      description: Versions (topic channel also used)
authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
