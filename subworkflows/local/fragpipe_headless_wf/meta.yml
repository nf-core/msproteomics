# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "fragpipe_headless_wf"
description: All-in-one FragPipe headless execution on the LC-MS files as given, after FragPipe's database decoy check
keywords:
  - proteomics
  - fragpipe
  - headless
  - dda
  - tmt
  - label-free
components:
  - philosopherdatabase
  - fragpipeheadless
  - fragpipe_database
input:
  - ch_files:
      type: channel
      description: |
        LC-MS files as FragPipe reads them (.raw, .mzML, .mzXML, .mgf, .mzBIN, Bruker .d).
        Structure: [ val(meta), path(spectra) ]
  - ch_fasta:
      type: channel
      description: |
        FASTA to update with FragPipe's "Add decoys" (decoys + contaminants) before the run;
        empty unless --add_philosopher_decoy / --add_philosopher_contaminants.
        Structure: [ val(meta), path(fasta) ]
  - ch_database:
      type: channel
      description: |
        FASTA searched as given (FragPipe database.db-path); FragPipe headless hard-fails
        when it holds no decoys with the workflow decoy tag. Empty when ch_fasta is used.
        Structure: [ val(meta), path(fasta) ]
  - ch_workflow_file:
      type: channel
      description: |
        FragPipe .workflow configuration file defining the analysis pipeline.
        Structure: path(workflow)
  - ch_manifest_rows:
      type: channel
      description: |
        Value channel, one row per LC-MS file.
        Structure: val([[filename, experiment, bioreplicate, data_type, group], ...])
  - ch_annotation_rows:
      type: channel
      description: |
        Value channel, TMT annotation, [] for LFQ.
        Structure: val([[group, channel, sample_name], ...])
output:
  - all_results:
      type: directory
      description: |
        Complete FragPipe output directory containing all results.
        Structure: path(results/**)
  - combined_protein:
      type: file
      description: |
        Combined protein-level quantification across all samples.
        Structure: path(combined_protein.tsv)
  - combined_peptide:
      type: file
      description: |
        Combined peptide-level quantification across all samples.
        Structure: path(combined_peptide.tsv)
  - combined_ion:
      type: file
      description: |
        Combined ion-level quantification across all samples.
        Structure: path(combined_ion.tsv)
authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
