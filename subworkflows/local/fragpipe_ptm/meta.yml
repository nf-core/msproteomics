# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "fragpipe_ptm"
description: Post-translational modification analysis with PTMShepherd for mass shift characterization, localization, and profiling
keywords:
  - proteomics
  - ptm
  - post-translational-modification
  - ptmshepherd
  - mass-shift
  - localization
components:
  - ptmshepherd
input:
  - ch_results_dir:
      type: channel
      description: |
        Per-sample results directories from PHILOSOPHERFILTER.
        Structure: [ val(meta), path(results_dir) ]
  - ch_mzml:
      type: channel
      description: |
        Spectra files in mzML format for mass shift analysis.
        Structure: [ val(meta), path(mzml) ]
  - ch_tool_configs:
      type: channel
      description: |
        Parsed JSON tool configuration map controlling PTMShepherd execution.
        Structure: val(tool_configs_map)
  - aggregate_meta:
      type: value
      description: |
        Metadata map for aggregate outputs (e.g., [id: 'fragpipe']).
  - ch_fasta:
      type: channel
      description: |
        Protein database FASTA for PTMShepherd analysis.
        Structure: path(fasta)
output:
  - psm_dirs:
      type: channel
      description: |
        Per group.
        Structure: [ val(meta), path(group_dir) ]
  - results_dir:
      type: channel
      description: |
        PTMShepherd results directory containing all PTM analysis output files.
        Structure: [ val(meta), path(results_dir) ]
  - glyco_masses:
      type: channel
      description: |
        Glyco masses.
        Structure: [ val(meta), path(glyco_masses_list.txt) ]
  - config:
      type: channel
      description: |
        Config.
        Structure: [ val(meta), path(shepherd.config) ]
  - versions:
      type: channel
      description: |
        Software versions (topic tuples).
        Structure: [ val(process), val(tool), val(version) ]
authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
