# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "fragpipe_quant"
description: Quantification module orchestration supporting IonQuant label-free quantification with MaxLFQ, TMTIntegrator for TMT isobaric labeling, and FreeQuant for simple label-free quantification
keywords:
  - proteomics
  - quantification
  - label-free
  - tmt
  - ionquant
  - tmtintegrator
  - freequant
  - maxlfq
components:
  - ionquant
  - tmtintegrator
  - freequant
  - philosopherlabelquant
  - philosopherreport
  - writetextfile
input:
  - ch_results_dir:
      type: channel
      description: |
        Per-sample results directories from PHILOSOPHERFILTER.
        Structure: [ val(meta), path(results_dir) ]
  - ch_mzml:
      type: channel
      description: |
        Spectra files in mzML format for quantification.
        Structure: [ val(meta), path(mzml) ]
  - ch_lcms_files:
      type: channel
      description: |
        Every samplesheet LC-MS file as given (FragPipe's file list).
        Structure: [ val(meta), path(spectra) ]
  - ch_annotation:
      type: channel
      description: |
        Annotation file for TMT/IsoQuant quantification. Pass [] when not used.
        Structure: path(annotation_file)
  - ch_tool_configs:
      type: channel
      description: |
        Parsed JSON tool configuration map controlling which quantification tools to run.
        Structure: val(tool_configs_map)
  - ch_glyco_masses:
      type: channel
      description: |
        Value channel, [] when AppendFile does not run (FragpipeRun.java:1822-1830).
        Structure: path(glyco_masses_list.txt)
  - aggregate_meta:
      type: value
      description: |
        Metadata map for aggregate outputs (e.g., [id: 'fragpipe']).
output:
  - combined_protein:
      type: channel
      description: |
        Combined protein quantification table from IonQuant.
        Structure: [ val(meta), path(combined_protein.tsv) ]
  - combined_peptide:
      type: channel
      description: |
        Combined peptide quantification table from IonQuant.
        Structure: [ val(meta), path(combined_peptide.tsv) ]
  - combined_ion:
      type: channel
      description: |
        Combined ion quantification table from IonQuant.
        Structure: [ val(meta), path(combined_ion.tsv) ]
  - combined_modified_peptide:
      type: channel
      description: |
        Combined modified peptide quantification table from IonQuant.
        Structure: [ val(meta), path(combined_modified_peptide.tsv) ]
  - experiment_annotation:
      type: channel
      description: |
        Experiment annotation.
  - tmt_abundance:
      type: channel
      description: |
        TMT abundance tables from TMTIntegrator.
        Structure: [ val(meta), path(abundance_*.tsv) ]
  - ionquant_dir:
      type: channel
      description: |
        IonQuant results directory.
        Structure: [ val(meta), path(results_dir) ]
  - reprint:
      type: channel
      description: |
        REPRINT tables IonQuant leaves in the work dir.
        Structure: [ val(mode), path(reprint.<mode>.tsv) ]
  - ionquant_ms1_dir:
      type: channel
      description: |
        Ionquant ms1 dir.
        Structure: [ val(meta), path(results_dir) ]
  - tmt_dir:
      type: channel
      description: |
        TMTIntegrator results directory.
        Structure: [ val(meta), path(tmt-report) ]
  - tmt_unmod_dir:
      type: channel
      description: |
        Tmt unmod dir.
        Structure: [ val(meta), path(tmt-report-unmod) ]
  - isobaric_dir:
      type: channel
      description: |
        Isobaric dir.
        Structure: [ val(meta), path(results_dir) ]
authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
