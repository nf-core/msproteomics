# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "fragpipe_search"
description: Single-stage database search with MSFragger, optional AI-based rescoring with MSBooster, and optional chimeric artifact removal with Crystal-C
keywords:
  - proteomics
  - database-search
  - msfragger
  - msbooster
  - crystalc
  - rescoring
components:
  - msfragger
  - msfraggercalibrate
  - msfragger/index
  - splitfasta
  - mergesplitsearch
  - msbooster
  - crystalc
  - msboosterthreads
  - msfraggerapplycalibration
  - sortfasta
input:
  - ch_mzml:
      type: channel
      description: |
        Spectra files in mzML or Bruker .d format.
        Structure: [ val(meta), path(mzml/d) ]
  - ch_fasta:
      type: channel
      description: |
        Protein database FASTA as a value channel for broadcasting.
        Structure: path(fasta)
  - ch_tool_configs:
      type: channel
      description: |
        Parsed JSON tool configuration map controlling MSFragger, MSBooster, and CrystalC execution.
        Structure: val(tool_configs_map)
  - ch_fragger_params:
      type: channel
      description: |
        MSFragger parameters file (fragger.params). Pass [] for CLI mode.
        Structure: path(fragger.params)
  - ch_msbooster_fragger_params:
      type: channel
      description: |
        Value channel, the one params file MSBooster reads (CmdMSBooster.java:134-149).
        Structure: path(fragger*.params)
  - ch_msbooster_params:
      type: channel
      description: |
        MSBooster parameters file (msbooster.config). Pass [] for CLI mode.
        Structure: path(msbooster.config)
  - ch_num_slices:
      type: channel
      description: |
        Value channel, msfragger.misc.slice-db of the workflow.
        Structure: val(int)
output:
  - pepxml:
      type: channel
      description: |
        Search result pepXML files. Uses CrystalC-filtered pepXML when CrystalC is enabled, otherwise raw MSFragger output.
        Structure: [ val(meta), path(pepxml) ]
  - pin:
      type: channel
      description: |
        Raw Percolator input (PIN) files from MSFragger.
        Structure: [ val(meta), path(pin) ]
  - pin_rescored:
      type: channel
      description: |
        Rescored PIN files. Uses MSBooster-edited PIN when MSBooster is enabled, otherwise raw MSFragger PIN.
        Structure: [ val(meta), path(pin) ]
  - tsv:
      type: channel
      description: |
        MSFragger TSV output files.
        Structure: [ val(meta), path(tsv) ]
  - results_dir:
      type: channel
      description: |
        Per-sample MSFragger results directory.
        Structure: [ val(meta), path(results_dir) ]
  - msfragger_logs:
      type: channel
      description: |
        Per-sample logs, or the split-mode calibration log.
        Structure: [ val(meta), path(log) ]
  - msfragger_split_logs:
      type: channel
      description: |
        Split-database mode only: the search log of every (file, chunk) MSFragger task (meta.id <file>_chunk_<i>).
        Structure: [ val(meta), path(log) ]
  - lcms:
      type: channel
      description: |
        FragPipe's LC-MS directory after the search.
        Structure: [ val(meta), [ path(lcms), path(msfragger side files)... ] ]
  - mzbin_all:
      type: channel
      description: |
        MSFragger's <stem>.mzBIN_all (write_mzbin_all = 1, Write sub mzML), read by WRITESUBMZML.
        Structure: [ val(meta), path(<stem>.mzBIN_all) ]
  - validation_lcms:
      type: channel
      description: |
        Spectra file named by Percolator / PeptideProphet.
        Structure: [ val(meta), path(spectra) ]
  - uncalibrated_mzml:
      type: channel
      description: |
        Uncalibrated mzML files produced by MSFragger for .d or .raw inputs. Used by MSBooster for Bruker data.
        Structure: [ val(meta), path(*_uncalibrated.mzML) ]
  - calibrated_mzml:
      type: channel
      description: |
        Write_calibrated_mzml with calibration.
        Structure: [ val(meta), path(*_calibrated.mzML) ]
authors:
  - "@dongzehe"
maintainers:
  - "@dongzehe"
